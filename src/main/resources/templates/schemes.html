<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>All Schemes</title>

<style>

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f7fb;
}

/* HEADER */
h1 {
    text-align: center;
    font-size: 42px;
    margin-top: 30px;
    background: linear-gradient(90deg, #0E3B2E, #1b8a5a);
    -webkit-background-clip: text;
    color: transparent;
}

/* SUBTEXT */
.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 40px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
    padding: 0 40px 40px;
}

/* CARD */
.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    transition: 0.4s;
    position: relative;
    overflow: hidden;
}

/* TOP COLOR LINE */
.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, #6c63ff, #00c6ff);
}

/* HOVER EFFECT 🔥 */
.card:hover {
    transform: translateY(-12px) scale(1.02);
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

/* TITLE */
.card h2 {
    font-size: 20px;
    color: #0E3B2E;
    margin-bottom: 12px;
}

/* TEXT */
.card p {
    margin: 6px 0;
    font-size: 14px;
    color: #444;
}

/* CATEGORY BADGE */
.tag {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}

/* COLORS */
.student { background:#e3f2fd; color:#1976d2; }
.farmer { background:#e8f5e9; color:#2e7d32; }
.women { background:#fce4ec; color:#c2185b; }
.senior { background:#ede7f6; color:#512da8; }
.youth { background:#fff3e0; color:#ef6c00; }

/* BUTTON */
button {
    margin-top: 15px;
    padding: 10px 18px;
    border: none;
    background: linear-gradient(90deg, #6c63ff, #5a55e0);
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
}

/* BUTTON HOVER */
button:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(108,99,255,0.4);
}
</style>

</head>

<body>



<div class="container">

    <h1>Government Schemes</h1>
    <p class="subtitle">Find schemes based on your eligibility</p>

    <div class="grid">

        <!-- LOOP START -->
        <div class="card" th:each="scheme : ${schemes}">

            <h2 th:text="${scheme.schemeName}">Scheme Name</h2>

            <p><b>Minimum Age:</b> <span th:text="${scheme.minAge}"></span></p>
            <p><b>Maximum Income:</b> ₹<span th:text="${scheme.maxIncome}"></span></p>
            <p><b>State:</b> <span th:text="${scheme.state}"></span></p>

            <!-- CATEGORY TAG -->
            <span class="tag" 
                  th:text="${scheme.category}"
                  th:classappend="${scheme.category}">
            </span>

            <button>Apply Now</button>

        </div>
        <!-- LOOP END -->

    </div>

</div>

</div>

</body>
</html>
